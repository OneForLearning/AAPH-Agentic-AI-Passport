[workspace]
members = [
    "crates/aaph-core",
    "crates/aaph-authority",
    "crates/aaph-pep",
    "crates/aaph-server",
    "crates/aaph-e2e",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.84"

[workspace.dependencies]
aaph-core = { path = "crates/aaph-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
base64ct = "=1.6.0"
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_jcs = "0.1"
sha2 = "0.10"
zeroize = "=1.8.1"
async-trait = "0.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "io-util"] }
axum = { version = "0.7", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
home = "=0.5.11"
url = "=2.4.1"
indexmap = "=2.7.1"
axum-server = { version = "=0.7.3", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "=0.23.20", default-features = false, features = ["std", "ring"] }
hyper-util = "=0.1.17"
reqwest = { version = "=0.11.27", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
