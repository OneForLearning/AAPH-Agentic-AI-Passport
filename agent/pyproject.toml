[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "aaph-agent"
version = "0.1.0"
description = "NON_PRODUCTION_DEMO local AAPH agent"
requires-python = ">=3.12"
dependencies = ["cryptography==44.0.3", "httpx==0.28.1", "jcs==0.2.1"]

[project.scripts]
aaph-agent = "aaph_agent.main:main"

[tool.setuptools]
packages = ["aaph_agent"]
